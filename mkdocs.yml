site_name: "Lanilsen Homelab Docs"
site_description: "Architecture, network, Terraform, Ansible, storage, and operations notes for the Mo i Rana homelab"
site_author: "Lars Jørgen Nilsen"
site_url: "https://docs.lanilsen.com/"

repo_name: "larsj96/az-static-web-app-docs"
repo_url: "https://github.com/larsj96/az-static-web-app-docs"
edit_uri: "edit/main/docs/"

docs_dir: "docs"
site_dir: "build"
use_directory_urls: true

theme:
  name: "material"
  language: "en"
  palette:
    primary: "grey"
    accent: "blue"
  features:
    - navigation.instant
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.tasklist:
      custom_checkbox: true

plugins:
  - search:
      separator: '[\s]+'
      lang: en
  - git-revision-date
  - mermaid2

nav:
  - Home: README.md
  - Architecture:
      - Overview: architecture.md
      - Network Model: network-model.md
      - Storage Plan: storage-plan.md
      - Proxmox And Ceph: proxmox-ceph-plan.md
  - Infrastructure As Code:
      - Operating Model: iac-operating-model.md
      - Terraform State: terraform-cloud-state.md
      - Repository Split: repo-split-plan.md
      - Palo Alto Terraform: palo-alto-terraform.md
      - Palo GlobalProtect Remote Access: palo-globalprotect-remote-access.md
      - Implementation Roadmap: implementation-roadmap.md
  - Services:
      - Self-Hosted Docs Platform: self-hosted-docs-platform.md
      - Monitoring Platform: monitoring-platform.md
      - Media Platform: media-platform.md
      - Cloudflare Tunnel And Plex: cloudflare-tunnel-plex.md
  - Operations:
      - Frankfurt VPS Ops Hub: frankfurt-vps-ops-hub.md
      - Palo Alto SNMP Monitoring: palo-alto-snmp-monitoring.md
